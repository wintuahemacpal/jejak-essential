name: Build & publish Docker image

# Membangun image untuk deployment self-hosted (NAS, VPS) dan mendorongnya ke
# GitHub Container Registry — pengguna tinggal `docker compose pull`, bukan
# membangun sendiri (banyak NAS terlalu lemah untuk bundle install +
# tailwindcss build). Multi-arsitektur (amd64 + arm64).
#
# Visibilitas: PUBLIK supaya `docker compose pull` jalan tanpa `docker login`
# / PAT. Kode sumber tetap AGPL di git; lapisan image memang berisi .rb — sama
# transparan dengan clone repo. REST API GitHub tidak punya endpoint untuk
# mengubah visibilitas package (PUT .../visibility selalu 404), jadi owner
# mengaturnya sekali saja lewat UI: GitHub → Packages → jejak-lite →
# Package settings → Change visibility → Public. Setelan itu bertahan untuk
# setiap push berikutnya.

on:
  push:
    branches: [ master ]
    paths-ignore:
      - "**.md"
      - "IMPLEMENTATION_PLAN.md"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  # Ditulis tetap, tidak mengikuti github.repository: nama repo boleh berganti,
  # tetapi docker-compose dan server yang sudah berjalan menarik image dengan
  # nama ini. Kalau mengikuti nama repo, server diam-diam berhenti dapat pembaruan.
  IMAGE_NAME: ghcr.io/wintuahemacpal/jejak-lite

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU (emulasi arsitektur non-native untuk build arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image multi-arsitektur
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
